[package]
name = "qurio-server"
version = "1.0.0-dev"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "json"] }
futures-util = { version = "0.3.34", features = ["sink", "std"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
qurio-protocol = { path = "../qurio-protocol" }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytes = "1.12.1"
