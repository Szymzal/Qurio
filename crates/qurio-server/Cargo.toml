[package]
name = "qurio-server"
version = "1.0.0-dev"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "json"] }
futures-util = { version = "0.3.31", features = ["sink", "std"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
qurio-protocol = { path = "../qurio-protocol" }
anyhow = "1.0.101"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bytes = "1.11.1"
