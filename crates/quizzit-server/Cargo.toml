[package]
name = "quizzit-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.7", features = ["ws", "json"] }
futures-util = { version = "0.3.31", features = ["sink", "std"] }
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.7", features = ["timeout", "trace"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
quizzit-protocol = { path = "../quizzit-protocol" }
anyhow = "1.0.100"
thiserror = "2.0.17"
